config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/awm:
      branch: main
      repo: https://github.com/grycap/awm
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-heliotrope-sheepdog.sh
        container: qc.acc_bumpy-khaki-earwig
  QC.Doc:
    repos:
      github.com/grycap/awm find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-beige-cheetah.sh
        container: qc.doc_smelly-tangerine-nightingale
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-green-yak.sh
        container: qc.doc_paltry-pink-angora
      github.com/grycap/awm markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.grumpy-flax-maltese.sh
        container: qc.doc_smelly-crimson-slug
  QC.Lic:
    repos:
      github.com/grycap/awm licensee:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-gold-blue.sh
        container: qc.lic_smelly-charcoal-tuatara
  QC.Met:
    repos:
      github.com/grycap/awm validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-celadon-swan.sh
        container: qc.met_shaky-malachite-moth
  QC.Sec:
    repos:
      github.com/grycap/awm bandit:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-chartreuse-newt.sh
        container: qc.sec_cozy-jade-dugong
  QC.Sty:
    repos:
      github.com/grycap/awm flake8:
        commands:
        - /usr/bin/env sh .sqa/script.homey-seashell-akbash.sh
        container: qc.sty_chummy-viridian-hound
      github.com/grycap/awm hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.beady-brass-elephant.sh
        container: qc.sty_muzzy-firebrick-mule
      github.com/grycap/awm jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.jumpy-heliotrope-butterfly.sh
        container: qc.sty_randy-xanthic-markhor
  QC.Uni:
    repos:
      github.com/grycap/awm pytest:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-blue-eagle.sh
        container: qc.uni_nippy-cobalt-mouse
  QC.Ver:
    repos:
      github.com/grycap/awm get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-platinum-ray.sh
        container: qc.ver_muzzy-bronze-walrus
timeout: 5400
