config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/awm:
      branch: sqa
      repo: https://github.com/grycap/awm
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-cyan-fly.sh
        container: qc.acc_woozy-mauve-corgi
  QC.Doc:
    repos:
      github.com/grycap/awm find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-charcoal-peccary.sh
        container: qc.doc_scummy-rust-akita
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-asparagus-dollar.sh
        container: qc.doc_squirrely-coral-anteater
      github.com/grycap/awm markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.beady-magnolia-centipede.sh
        container: qc.doc_seedy-coral-chameleon
  QC.Lic:
    repos:
      github.com/grycap/awm licensee:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-champagne-lizard.sh
        container: qc.lic_slimy-cardinal-impala
  QC.Met:
    repos:
      github.com/grycap/awm validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.baggy-cyan-sheepdog.sh
        container: qc.met_shaggy-indigo-hummingbird
  QC.Sec:
    repos:
      github.com/grycap/awm bandit:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-cream-millipede.sh
        container: qc.sec_freaky-ivory-centipede
  QC.Sty:
    repos:
      github.com/grycap/awm flake8:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-olive-robin.sh
        container: qc.sty_dorky-cinnamon-bee
      github.com/grycap/awm hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-brass-bonobo.sh
        container: qc.sty_pasty-olive-termite
      github.com/grycap/awm jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-lemon-quoll.sh
        container: qc.sty_bluesy-cerise-cougar
  QC.Uni:
    repos:
      github.com/grycap/awm commands:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-ecru-affenpinscher.sh
        container: qc.uni_chummy-lime-gibbon
  QC.Ver:
    repos:
      github.com/grycap/awm get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.silly-amber-echidna.sh
        container: qc.ver_flaky-periwinkle-bandicoot
timeout: 5400
