config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/awm:
      branch: main
      repo: https://github.com/grycap/awm
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-green-termite.sh
        container: qc.acc_muzzy-chartreuse-macaw
  QC.Doc:
    repos:
      github.com/grycap/awm find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.scummy-burgundy-frigatebird.sh
        container: qc.doc_frumpy-ultramarine-newfoundland
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.cranky-peach-monkey.sh
        container: qc.doc_nippy-magenta-mayfly
      github.com/grycap/awm markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flaky-russet-quetzal.sh
        container: qc.doc_chummy-buff-kingfisher
  QC.Lic:
    repos:
      github.com/grycap/awm licensee:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-charcoal-burmese.sh
        container: qc.lic_wiggy-green-chin
  QC.Sec:
    repos:
      github.com/grycap/awm bandit:
        commands:
        - /usr/bin/env sh .sqa/script.beady-chocolate-cockroach.sh
        container: qc.sec_hazy-blue-chamois
  QC.Sty:
    repos:
      github.com/grycap/awm flake8:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-champagne-scorpion.sh
        container: qc.sty_seedy-blue-loon
      github.com/grycap/awm hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-chartreuse-mouse.sh
        container: qc.sty_messy-gold-angelfish
  QC.Uni:
    repos:
      github.com/grycap/awm pytest:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-bistre-moose.sh
        container: qc.uni_baggy-chartreuse-coati
  QC.Ver:
    repos:
      github.com/grycap/awm get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-purple-seal.sh
        container: qc.ver_sunny-platinum-lobster
timeout: 5400
