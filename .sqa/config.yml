config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/awm:
      branch: sqa
      repo: https://github.com/grycap/awm
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-olivine-maltese.sh
        container: qc.acc_chewy-beige-ibis
  QC.Doc:
    repos:
      github.com/grycap/awm find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-amaranth-numbat.sh
        container: qc.doc_lousy-brown-millipede
      github.com/grycap/awm git:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-brown-sheepdog.sh
        container: qc.doc_hasty-cerulean-crane
      github.com/grycap/awm markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-razzmatazz-reindeer.sh
        container: qc.doc_shabby-lime-corgi
  QC.Lic:
    repos:
      github.com/grycap/awm licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-buff-woodlouse.sh
        container: qc.lic_silly-sepia-dormouse
  QC.Met:
    repos:
      github.com/grycap/awm validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-turquoise-collie.sh
        container: qc.met_thirsty-grey-insect
  QC.Sec:
    repos:
      github.com/grycap/awm bandit:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-lilac-frise.sh
        container: qc.sec_flabby-red-lemur
  QC.Sty:
    repos:
      github.com/grycap/awm flake8:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-yellow-stingray.sh
        container: qc.sty_shaky-alizarin-terrier
      github.com/grycap/awm hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.droopy-gamboge-chamois.sh
        container: qc.sty_homely-chocolate-donkey
      github.com/grycap/awm jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-denim-bonobo.sh
        container: qc.sty_flaky-cerise-barb
  QC.Uni:
    repos:
      github.com/grycap/awm commands:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-auburn-dane.sh
        container: qc.uni_beady-mustard-wombat
  QC.Ver:
    repos:
      github.com/grycap/awm get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-cerulean-monkey.sh
        container: qc.ver_pokey-emerald-bloodhound
timeout: 5400
